<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio — Web Code Compiler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #09090b;
      --bg-secondary: #121215;
      --bg-tertiary: #18181b;
      --bg-hover: #27272a;
      --border: #27272a;
      --border-focus: #52525b;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #fafafa;
      --accent-fg: #09090b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #3b82f6;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html.light {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-hover: #e2e8f0;
      --border: #e2e8f0;
      --border-focus: #94a3b8;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #0f172a;
      --accent-fg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header / Toolbar */
    .header {
      height: 46px;
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .header-left, .header-center, .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.02em;
      padding-right: 8px;
      color: var(--text-primary);
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .divider-v {
      width: 1px;
      height: 18px;
      background-color: var(--border);
      margin: 0 4px;
    }

    /* File Tabs */
    .tabs {
      display: flex;
      align-items: center;
      background-color: var(--bg-secondary);
      padding: 3px;
      border-radius: 7px;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.12s ease;
      font-family: var(--font-sans);
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    .tab svg {
      width: 14px;
      height: 14px;
    }

    .lang-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .lang-html { background-color: #f97316; }
    .lang-css { background-color: #3b82f6; }
    .lang-js { background-color: #eab308; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background-color: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.12s ease;
      font-family: var(--font-sans);
    }

    .btn:hover {
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
    }

    .btn-outline {
      border-color: var(--border);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
    }

    .btn-outline:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-focus);
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-fg);
      font-weight: 500;
    }

    .btn-primary:hover {
      opacity: 0.9;
      background-color: var(--accent);
      color: var(--accent-fg);
    }

    .btn-icon {
      padding: 0;
      width: 30px;
    }

    .btn.active-toggle {
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
      border-color: var(--border);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.6;
      flex-shrink: 0;
    }

    .kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background-color: rgba(128, 128, 128, 0.15);
      color: inherit;
      opacity: 0.8;
    }

    /* Workspace Split Layout */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .pane-editor {
      width: 50%;
      min-width: 240px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      position: relative;
    }

    #monaco-root {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* Resizer Bars */
    .resizer-h {
      width: 5px;
      background-color: var(--bg-primary);
      border-left: 1px solid var(--border);
      cursor: col-resize;
      transition: background-color 0.15s ease;
      z-index: 15;
      flex-shrink: 0;
    }

    .resizer-h:hover, .resizer-h.dragging {
      background-color: var(--info);
      border-left-color: var(--info);
    }

    .resizer-v {
      height: 5px;
      background-color: var(--bg-primary);
      border-top: 1px solid var(--border);
      cursor: row-resize;
      transition: background-color 0.15s ease;
      z-index: 15;
      flex-shrink: 0;
    }

    .resizer-v:hover, .resizer-v.dragging {
      background-color: var(--info);
      border-top-color: var(--info);
    }

    /* Right Output Pane */
    .pane-output {
      flex: 1;
      min-width: 240px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-secondary);
      overflow: hidden;
    }

    .preview-toolbar {
      height: 34px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
    }

    .url-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .url-pill svg {
      width: 12px;
      height: 12px;
      color: var(--success);
    }

    .viewport-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .preview-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-tertiary);
      overflow: auto;
      position: relative;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), height 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .iframe-wrapper.vp-tablet {
      width: 768px;
      height: 92%;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .iframe-wrapper.vp-mobile {
      width: 375px;
      height: 88%;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    iframe#preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff;
    }

    /* Overlay to prevent iframe stealing mouse events while dragging splitters */
    .drag-shield {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
    }

    /* Console Drawer */
    .console-container {
      height: 185px;
      min-height: 32px;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .console-container.collapsed {
      height: 32px !important;
    }

    .console-header {
      height: 32px;
      padding: 0 12px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      cursor: pointer;
    }

    .console-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .console-title svg {
      width: 13px;
      height: 13px;
    }

    .badge {
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-family: var(--font-mono);
      background-color: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .badge.has-errors {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .console-logs {
      flex: 1;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 0;
      user-select: text;
    }

    .log-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 5px 12px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.08);
      line-height: 1.45;
      word-break: break-word;
    }

    .log-row:hover {
      background-color: var(--bg-secondary);
    }

    .log-time {
      color: var(--text-muted);
      font-size: 10px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .log-content {
      flex: 1;
      white-space: pre-wrap;
      color: var(--text-primary);
    }

    .log-row.warn {
      background-color: rgba(245, 158, 11, 0.07);
    }
    .log-row.warn .log-content { color: var(--warning); }

    .log-row.error {
      background-color: rgba(239, 68, 68, 0.08);
    }
    .log-row.error .log-content { color: var(--danger); }

    .log-row.info .log-content { color: var(--info); }

    .console-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-top: 1px solid var(--border);
      background-color: var(--bg-primary);
    }

    .console-input-bar svg {
      width: 13px;
      height: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .console-eval-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    /* Footer Status Bar */
    .statusbar {
      height: 24px;
      background-color: var(--bg-primary);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
      z-index: 20;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 36px;
      right: 16px;
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      transform: translateY(12px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 1000;
    }

    .toast.visible {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Drag Shield for smooth Split Resizing -->
  <div class="drag-shield" id="drag-shield"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Studio</span>
      </div>
      <div class="divider-v"></div>

      <!-- Language File Tabs -->
      <div class="tabs" role="tablist">
        <button class="tab active" data-lang="html" onclick="switchTab('html')">
          <span class="lang-indicator lang-html"></span>
          index.html
        </button>
        <button class="tab" data-lang="css" onclick="switchTab('css')">
          <span class="lang-indicator lang-css"></span>
          styles.css
        </button>
        <button class="tab" data-lang="javascript" onclick="switchTab('javascript')">
          <span class="lang-indicator lang-js"></span>
          app.js
        </button>
      </div>
    </div>

    <!-- Center Actions -->
    <div class="header-center">
      <button class="btn btn-primary" onclick="compileCode(true)" title="Compile and Run (Ctrl/Cmd + Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
        <span>Run</span>
        <span class="kbd">⌘↵</span>
      </button>

      <button class="btn active-toggle" id="btn-autorun" onclick="toggleAutoRun()" title="Toggle Live Auto-Run">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
        <span>Auto</span>
      </button>

      <button class="btn" onclick="formatActiveCode()" title="Format Code (Shift + Alt + F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" x2="3" y1="6" y2="6"></line>
          <line x1="15" x2="3" y1="12" y2="12"></line>
          <line x1="17" x2="3" y1="18" y2="18"></line>
        </svg>
        <span>Format</span>
      </button>
    </div>

    <!-- Right Utilities -->
    <div class="header-right">
      <button class="btn" onclick="resetTemplate()" title="Reset to Default Starter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>

      <button class="btn btn-outline" onclick="exportSingleHTML()" title="Download bundled HTML file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" x2="12" y1="15" y2="3"></line>
        </svg>
        <span>Export</span>
      </button>

      <button class="btn btn-icon" id="btn-theme" onclick="toggleTheme()" title="Switch Theme">
        <svg id="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path><path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path><path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Split Workspace -->
  <main class="workspace" id="workspace">
    <!-- Left Editor Pane -->
    <section class="pane-editor" id="pane-editor">
      <div id="monaco-root"></div>
    </section>

    <!-- Horizontal Drag Handle -->
    <div class="resizer-h" id="resizer-h"></div>

    <!-- Right Preview & Console Pane -->
    <section class="pane-output" id="pane-output">
      <!-- Preview Sub-Toolbar -->
      <div class="preview-toolbar">
        <div class="url-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>sandbox://live-preview</span>
          <span id="viewport-dimensions" style="margin-left: 6px; opacity: 0.7;"></span>
        </div>

        <div class="viewport-controls">
          <button class="btn btn-icon active-toggle" id="vp-desktop" onclick="setViewport('desktop')" title="Responsive Desktop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="14" x="2" y="3" rx="2"></rect>
              <line x1="8" x2="16" y1="21" y2="21"></line>
              <line x1="12" x2="12" y1="17" y2="21"></line>
            </svg>
          </button>
          <button class="btn btn-icon" id="vp-tablet" onclick="setViewport('tablet')" title="Tablet (768px)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect width="16" height="20" x="4" y="2" rx="2" ry="2"></rect>
              <line x1="12" x2="12.01" y1="18" y2="18"></line>
            </svg>
          </button>
          <button class="btn btn-icon" id="vp-mobile" onclick="setViewport('mobile')" title="Mobile (375px)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect width="12" height="20" x="6" y="2" rx="2" ry="2"></rect>
              <line x1="12" x2="12.01" y1="18" y2="18"></line>
            </svg>
          </button>
          <div class="divider-v"></div>
          <button class="btn btn-icon" onclick="openStandaloneWindow()" title="Open Preview in New Tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" x2="21" y1="14" y2="3"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Sandboxed Output Stage -->
      <div class="preview-stage">
        <div class="iframe-wrapper" id="iframe-wrapper">
          <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
        </div>
      </div>

      <!-- Vertical Drag Handle -->
      <div class="resizer-v" id="resizer-v"></div>

      <!-- Integrated Console -->
      <div class="console-container" id="console-container">
        <div class="console-header" onclick="toggleConsoleCollapse(event)">
          <div class="console-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" x2="20" y1="19" y2="19"></line>
            </svg>
            <span>Console</span>
            <span class="badge" id="console-badge">0</span>
          </div>
          <div style="display: flex; align-items: center; gap: 4px;">
            <button class="btn btn-icon" onclick="clearConsole(event)" title="Clear Console" style="height:24px; width:24px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" x2="19.07" y1="4.93" y2="19.07"></line>
              </svg>
            </button>
            <button class="btn btn-icon" id="btn-console-chevron" title="Toggle Console" style="height:24px; width:24px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <div class="console-logs" id="console-logs"></div>

        <div class="console-input-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
          <input
            type="text"
            class="console-eval-input"
            id="console-eval"
            placeholder="Evaluate JavaScript expression in sandbox..."
            autocomplete="off"
          />
        </div>
      </div>
    </section>
  </main>

  <!-- Status Bar -->
  <footer class="statusbar">
    <div class="status-group">
      <div class="status-item">
        <span>Ready</span>
      </div>
      <div class="status-item" id="status-CompileTime">
        <span>Compiled in 0ms</span>
      </div>
    </div>
    <div class="status-group">
      <div class="status-item" id="status-cursor">Ln 1, Col 1</div>
      <div class="status-item" id="status-lang">HTML</div>
      <div class="status-item">UTF-8</div>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Monaco Loader from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
    const STORAGE_KEY = 'studio_compiler_state_v1';

    const DEFAULT_CODE = {
      html: `<div class="card">
  <div class="status-pill">
    <span class="pulse"></span>
    System Operational
  </div>
  <h1>Minimal Enterprise Sandbox</h1>
  <p>Edit HTML, CSS, or JavaScript on the left to inspect real-time DOM updates and runtime telemetry.</p>
  
  <div class="metrics">
    <div class="metric-box">
      <span class="label">Latency</span>
      <span class="value" id="latency-val">14ms</span>
    </div>
    <div class="metric-box">
      <span class="label">Events</span>
      <span class="value" id="counter-val">0</span>
    </div>
  </div>

  <div class="actions">
    <button id="ping-btn" class="primary-btn">Dispatch Event</button>
    <button id="warn-btn" class="secondary-btn">Test Warning</button>
  </div>
</div>`,
      css: `* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #f8fafc;
  color: #0f172a;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 32px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 500;
  color: #059669;
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 16px;
}

.pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #10b981;
}

h1 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

p {
  font-size: 14px;
  line-height: 1.6;
  color: #64748b;
  margin-bottom: 24px;
}

.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}

.metric-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 12px 16px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.metric-box .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #64748b;
}

.metric-box .value {
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.actions {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}

.primary-btn {
  background: #0f172a;
  color: #ffffff;
  border: 1px solid #0f172a;
}

.primary-btn:hover {
  background: #1e293b;
}

.secondary-btn {
  background: #ffffff;
  color: #334155;
  border: 1px solid #cbd5e1;
}

.secondary-btn:hover {
  background: #f1f5f9;
}`,
      javascript: `let count = 0;
const counterEl = document.getElementById('counter-val');
const latencyEl = document.getElementById('latency-val');

document.getElementById('ping-btn').addEventListener('click', () => {
  count++;
  const ms = Math.floor(Math.random() * 12) + 8;
  counterEl.textContent = count;
  latencyEl.textContent = ms + 'ms';
  console.log(\`[Event #\${count}] Dispatched payload in \${ms}ms\`);
});

document.getElementById('warn-btn').addEventListener('click', () => {
  console.warn('High memory watermark threshold simulated (82%)');
});

console.info('Sandbox runtime initialized.');`
    };

    let state = {
      activeLang: 'html',
      autoRun: true,
      theme: 'dark',
      code: { ...DEFAULT_CODE }
    };

    // Load saved code from localStorage
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        state.code = { ...DEFAULT_CODE, ...parsed.code };
        state.theme = parsed.theme || 'dark';
      }
    } catch (e) {}

    let editor = null;
    let models = {};
    let debounceTimer = null;
    let logCount = 0;
    let errorCount = 0;

    // Apply initial theme
    if (state.theme === 'light') {
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
    }

    // Configure Monaco Editor
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });

    window.MonacoEnvironment = {
      getWorkerUrl: function (workerId, label) {
        return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
          self.MonacoEnvironment = {
            baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/'
          };
          importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js');`
        )}`;
      }
    };

    require(['vs/editor/editor.main'], function () {
      monaco.editor.defineTheme('studio-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#09090b',
          'editor.lineHighlightBackground': '#121215',
          'editorLineNumber.foreground': '#52525b',
          'editorLineNumber.activeForeground': '#e4e4e7',
          'editorIndentGuide.background': '#18181b',
          'editorGutter.background': '#09090b'
        }
      });

      monaco.editor.defineTheme('studio-light', {
        base: 'vs',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#ffffff',
          'editor.lineHighlightBackground': '#f8fafc',
          'editorLineNumber.foreground': '#94a3b8',
          'editorGutter.background': '#ffffff'
        }
      });

      models.html = monaco.editor.createModel(state.code.html, 'html');
      models.css = monaco.editor.createModel(state.code.css, 'css');
      models.javascript = monaco.editor.createModel(state.code.javascript, 'javascript');

      editor = monaco.editor.create(document.getElementById('monaco-root'), {
        model: models.html,
        theme: state.theme === 'dark' ? 'studio-dark' : 'studio-light',
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 13,
        lineHeight: 21,
        fontLigatures: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        smoothScrolling: true,
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
        padding: { top: 14, bottom: 14 },
        renderLineHighlight: 'all',
        bracketPairColorization: { enabled: true },
        automaticLayout: true,
        tabSize: 2
      });

      // Listen for changes across all models
      Object.keys(models).forEach((lang) => {
        models[lang].onDidChangeContent(() => {
          state.code[lang] = models[lang].getValue();
          persistState();
          if (state.autoRun) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => compileCode(false), 380);
          }
        });
      });

      // Cursor status bar telemetry
      editor.onDidChangeCursorPosition((e) => {
        document.getElementById('status-cursor').textContent =
          `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
      });

      // Keybinding: Cmd/Ctrl + Enter to Run
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
        compileCode(true);
      });

      compileCode(false);
    });

    function switchTab(lang) {
      if (!editor || !models[lang]) return;
      state.activeLang = lang;
      editor.setModel(models[lang]);
      editor.focus();

      document.querySelectorAll('.tab').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      const labelMap = { html: 'HTML', css: 'CSS', javascript: 'JavaScript' };
      document.getElementById('status-lang').textContent = labelMap[lang];
    }

    function compileCode(manual = false) {
      const t0 = performance.now();
      clearConsole();

      const html = state.code.html;
      const css = state.code.css;
      const js = state.code.javascript;

      const consoleBridgeScript = `
        <script>
          (function() {
            const send = (level, args) => {
              try {
                const serialized = Array.from(args).map(item => {
                  if (item instanceof Error) return item.stack || item.message;
                  if (typeof item === 'object' && item !== null) {
                    try { return JSON.stringify(item, null, 2); } catch(e) { return String(item); }
                  }
                  return String(item);
                });
                window.parent.postMessage({ source: 'studio-sandbox', level, payload: serialized }, '*');
              } catch (err) {}
            };

            const origLog = console.log;
            const origWarn = console.warn;
            const origError = console.error;
            const origInfo = console.info;

            console.log = function(...args) { send('log', args); origLog.apply(console, args); };
            console.warn = function(...args) { send('warn', args); origWarn.apply(console, args); };
            console.error = function(...args) { send('error', args); origError.apply(console, args); };
            console.info = function(...args) { send('info', args); origInfo.apply(console, args); };

            window.addEventListener('error', function(e) {
              send('error', [e.message + ' (Line ' + e.lineno + ')']);
            });

            window.addEventListener('unhandledrejection', function(e) {
              send('error', ['Unhandled Promise Rejection: ' + e.reason]);
            });

            window.addEventListener('message', function(e) {
              if (e.data && e.data.type === 'studio-eval') {
                try {
                  const res = eval(e.data.expr);
                  console.log('←', res);
                } catch (err) {
                  console.error(err);
                }
              }
            });
          })();
        <\/script>
      `;

      const documentSource = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>${css}</style>
  ${consoleBridgeScript}
</head>
<body>
  ${html}
  <script>
    try {
      ${js}
    } catch (err) {
      console.error(err);
    }
  <\/script>
</body>
</html>`;

      const frame = document.getElementById('preview-frame');
      frame.srcdoc = documentSource;

      const dt = Math.round(performance.now() - t0);
      document.getElementById('status-CompileTime').textContent = `Compiled in ${dt}ms`;
      if (manual) showToast('Compiled & Executed');
    }

    // Listen for sandbox console logs
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.source !== 'studio-sandbox') return;
      appendConsoleRow(event.data.level, event.data.payload.join(' '));
    });

    function appendConsoleRow(level, text) {
      const container = document.getElementById('console-logs');
      const row = document.createElement('div');
      row.className = `log-row ${level}`;

      const now = new Date();
      const timestamp = now.toTimeString().split(' ')[0];

      const timeEl = document.createElement('span');
      timeEl.className = 'log-time';
      timeEl.textContent = timestamp;

      const contentEl = document.createElement('div');
      contentEl.className = 'log-content';
      contentEl.textContent = text;

      row.appendChild(timeEl);
      row.appendChild(contentEl);
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;

      logCount++;
      if (level === 'error') errorCount++;
      updateConsoleBadge();
    }

    function clearConsole(e) {
      if (e) e.stopPropagation();
      document.getElementById('console-logs').innerHTML = '';
      logCount = 0;
      errorCount = 0;
      updateConsoleBadge();
    }

    function updateConsoleBadge() {
      const badge = document.getElementById('console-badge');
      badge.textContent = logCount;
      badge.classList.toggle('has-errors', errorCount > 0);
    }

    // Interactive Console REPL Evaluation
    document.getElementById('console-eval').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        const expr = e.target.value;
        appendConsoleRow('info', `→ ${expr}`);
        const frame = document.getElementById('preview-frame');
        frame.contentWindow.postMessage({ type: 'studio-eval', expr }, '*');
        e.target.value = '';
      }
    });

    function toggleConsoleCollapse(e) {
      const box = document.getElementById('console-container');
      box.classList.toggle('collapsed');
    }

    function toggleAutoRun() {
      state.autoRun = !state.autoRun;
      document.getElementById('btn-autorun').classList.toggle('active-toggle', state.autoRun);
      showToast(state.autoRun ? 'Auto-Run Enabled' : 'Auto-Run Disabled');
    }

    function formatActiveCode() {
      if (!editor) return;
      editor.getAction('editor.action.formatDocument').run();
      showToast('Document Formatted');
    }

    function setViewport(mode) {
      const wrapper = document.getElementById('iframe-wrapper');
      const dimLabel = document.getElementById('viewport-dimensions');
      wrapper.className = 'iframe-wrapper';

      ['desktop', 'tablet', 'mobile'].forEach((m) => {
        document.getElementById(`vp-${m}`).classList.toggle('active-toggle', m === mode);
      });

      if (mode === 'tablet') {
        wrapper.classList.add('vp-tablet');
        dimLabel.textContent = '768px';
      } else if (mode === 'mobile') {
        wrapper.classList.add('vp-mobile');
        dimLabel.textContent = '375px';
      } else {
        dimLabel.textContent = '';
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      document.documentElement.classList.toggle('light', state.theme === 'light');
      if (editor) {
        monaco.editor.setTheme(state.theme === 'dark' ? 'studio-dark' : 'studio-light');
      }
      persistState();
    }

    function resetTemplate() {
      if (!confirm('Reset HTML, CSS, and JS to the starter template?')) return;
      state.code = { ...DEFAULT_CODE };
      models.html.setValue(state.code.html);
      models.css.setValue(state.code.css);
      models.javascript.setValue(state.code.javascript);
      compileCode(true);
      showToast('Workspace Reset');
    }

    function exportSingleHTML() {
      const bundle = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exported Project</title>
  <style>
${state.code.css}
  </style>
</head>
<body>
${state.code.html}
  <script>
${state.code.javascript}
  <\/script>
</body>
</html>`;

      const blob = new Blob([bundle], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exported index.html');
    }

    function openStandaloneWindow() {
      const win = window.open('', '_blank');
      if (!win) return;
      const frame = document.getElementById('preview-frame');
      win.document.open();
      win.document.write(frame.srcdoc);
      win.document.close();
    }

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          code: state.code,
          theme: state.theme
        }));
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('visible'), 1800);
    }

    // Split Pane Dragging Mechanics
    (function initSplitResizers() {
      const resizerH = document.getElementById('resizer-h');
      const resizerV = document.getElementById('resizer-v');
      const paneEditor = document.getElementById('pane-editor');
      const consoleBox = document.getElementById('console-container');
      const workspace = document.getElementById('workspace');
      const paneOutput = document.getElementById('pane-output');
      const shield = document.getElementById('drag-shield');

      let draggingH = false;
      let draggingV = false;

      resizerH.addEventListener('mousedown', () => {
        draggingH = true;
        resizerH.classList.add('dragging');
        shield.style.display = 'block';
        shield.style.cursor = 'col-resize';
      });

      resizerV.addEventListener('mousedown', () => {
        draggingV = true;
        resizerV.classList.add('dragging');
        consoleBox.classList.remove('collapsed');
        shield.style.display = 'block';
        shield.style.cursor = 'row-resize';
      });

      window.addEventListener('mousemove', (e) => {
        if (draggingH) {
          const rect = workspace.getBoundingClientRect();
          const newWidth = Math.min(Math.max(240, e.clientX - rect.left), rect.width - 240);
          paneEditor.style.width = `${(newWidth / rect.width) * 100}%`;
        }
        if (draggingV) {
          const rect = paneOutput.getBoundingClientRect();
          const newHeight = Math.min(Math.max(32, rect.bottom - e.clientY), rect.height - 120);
          consoleBox.style.height = `${newHeight}px`;
        }
      });

      window.addEventListener('mouseup', () => {
        if (draggingH || draggingV) {
          draggingH = false;
          draggingV = false;
          resizerH.classList.remove('dragging');
          resizerV.classList.remove('dragging');
          shield.style.display = 'none';
        }
      });
    })();
  </script>
</body>
</html>
