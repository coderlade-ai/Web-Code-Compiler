<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio — Enterprise Web Compiler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- JSZip for client-side ZIP generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-primary: #09090b;
      --bg-secondary: #121215;
      --bg-tertiary: #18181b;
      --bg-canvas: #050507;
      --bg-hover: #27272a;
      --border: #27272a;
      --border-focus: #52525b;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #fafafa;
      --accent-fg: #09090b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #3b82f6;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html.light {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-canvas: #e2e8f0;
      --bg-hover: #e2e8f0;
      --border: #e2e8f0;
      --border-focus: #94a3b8;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #0f172a;
      --accent-fg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header / Toolbar */
    .header {
      height: 48px;
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
      z-index: 30;
    }

    .header-left, .header-center, .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.02em;
      padding-right: 6px;
      color: var(--text-primary);
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .divider-v {
      width: 1px;
      height: 18px;
      background-color: var(--border);
      margin: 0 4px;
    }

    /* File Tabs */
    .tabs {
      display: flex;
      align-items: center;
      background-color: var(--bg-secondary);
      padding: 3px;
      border-radius: 7px;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.12s ease;
      font-family: var(--font-sans);
      position: relative;
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    .tab-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .tab.has-content .tab-dot {
      opacity: 1;
      background-color: var(--info);
    }

    .lang-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .lang-html { background-color: #f97316; }
    .lang-css { background-color: #3b82f6; }
    .lang-js { background-color: #eab308; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background-color: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.12s ease;
      font-family: var(--font-sans);
      white-space: nowrap;
    }

    .btn:hover {
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
    }

    .btn-outline {
      border-color: var(--border);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
    }

    .btn-outline:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-focus);
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-fg);
      font-weight: 500;
    }

    .btn-primary:hover {
      opacity: 0.9;
      background-color: var(--accent);
      color: var(--accent-fg);
    }

    .btn-icon {
      padding: 0;
      width: 30px;
    }

    .btn.active-toggle {
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
      border-color: var(--border);
    }

    .btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 1.65;
      flex-shrink: 0;
    }

    .kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background-color: rgba(128, 128, 128, 0.15);
      color: inherit;
      opacity: 0.85;
    }

    /* Export Dropdown */
    .dropdown-wrapper {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 220px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 100;
    }

    .dropdown-menu.open {
      display: flex;
    }

    .dropdown-header {
      padding: 6px 10px 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.12s ease;
    }

    .dropdown-item:hover {
      background-color: var(--bg-hover);
    }

    .dropdown-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-item svg {
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
      stroke-width: 1.65;
    }

    .dropdown-ext {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      background-color: var(--bg-primary);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* Workspace Split Layout */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .pane-editor {
      width: 48%;
      min-width: 240px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      position: relative;
    }

    #monaco-root {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* Main Split Resizer Bars */
    .resizer-h {
      width: 5px;
      background-color: var(--bg-primary);
      border-left: 1px solid var(--border);
      cursor: col-resize;
      transition: background-color 0.15s ease;
      z-index: 15;
      flex-shrink: 0;
    }

    .resizer-h:hover, .resizer-h.dragging {
      background-color: var(--info);
      border-left-color: var(--info);
    }

    .resizer-v {
      height: 5px;
      background-color: var(--bg-primary);
      border-top: 1px solid var(--border);
      cursor: row-resize;
      transition: background-color 0.15s ease;
      z-index: 15;
      flex-shrink: 0;
    }

    .resizer-v:hover, .resizer-v.dragging {
      background-color: var(--info);
      border-top-color: var(--info);
    }

    /* Right Output Pane */
    .pane-output {
      flex: 1;
      min-width: 280px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-secondary);
      overflow: hidden;
    }

    .preview-toolbar {
      height: 36px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
      gap: 8px;
    }

    .preview-toolbar-left, .preview-toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .url-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 9px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .url-pill svg {
      width: 11px;
      height: 11px;
      color: var(--success);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--success);
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 2px 7px;
      border-radius: 99px;
    }

    .live-badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--success);
    }

    /* DevTools-Style Resizable Preview Stage */
    .preview-stage {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 16px 16px;
      overflow: auto;
      position: relative;
      padding: 16px 24px 24px 16px;
    }

    .preview-stage.fit-mode {
      padding: 0;
      align-items: stretch;
    }

    .inspect-viewport-box {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      min-width: 200px;
      min-height: 140px;
      border-radius: 4px;
    }

    .preview-stage.fit-mode .inspect-viewport-box {
      width: 100% !important;
      height: 100% !important;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    .preview-stage.fit-mode .vp-handle-r,
    .preview-stage.fit-mode .vp-handle-b,
    .preview-stage.fit-mode .vp-handle-br {
      display: none;
    }

    iframe#preview-frame, iframe#fs-preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff;
      flex: 1;
    }

    /* DevTools Inspect Resizer Handles */
    .vp-handle-r {
      position: absolute;
      top: 0;
      right: -14px;
      width: 14px;
      height: 100%;
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .vp-handle-r::after {
      content: '';
      width: 4px;
      height: 36px;
      border-radius: 2px;
      background-color: var(--border-focus);
      transition: background-color 0.15s ease, height 0.15s ease;
    }

    .vp-handle-r:hover::after, .vp-handle-r.active::after {
      background-color: var(--info);
      height: 52px;
    }

    .vp-handle-b {
      position: absolute;
      bottom: -14px;
      left: 0;
      height: 14px;
      width: 100%;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .vp-handle-b::after {
      content: '';
      height: 4px;
      width: 36px;
      border-radius: 2px;
      background-color: var(--border-focus);
      transition: background-color 0.15s ease, width 0.15s ease;
    }

    .vp-handle-b:hover::after, .vp-handle-b.active::after {
      background-color: var(--info);
      width: 52px;
    }

    .vp-handle-br {
      position: absolute;
      bottom: -14px;
      right: -14px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 12;
      color: var(--text-muted);
    }

    .vp-handle-br:hover, .vp-handle-br.active {
      color: var(--info);
    }

    /* Dimension Input Pill in Preview Toolbar */
    .dim-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .dim-input {
      width: 44px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: center;
      outline: none;
      padding: 1px 0;
      border-radius: 3px;
    }

    .dim-input:focus {
      background-color: var(--bg-tertiary);
    }

    /* Fullscreen Preview Overlay */
    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      z-index: 2000;
      display: none;
      flex-direction: column;
    }

    .fullscreen-overlay.active {
      display: flex;
    }

    .fullscreen-bar {
      position: fixed;
      top: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 5px 8px 5px 12px;
      border-radius: 999px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      z-index: 2010;
      color: #fafafa;
      font-size: 11px;
      font-family: var(--font-mono);
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }

    .fullscreen-bar:hover {
      opacity: 1;
    }

    .fs-exit-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .fs-exit-btn:hover {
      background-color: rgba(239, 68, 68, 0.85);
    }

    .fs-exit-btn svg {
      width: 13px;
      height: 13px;
    }

    /* Drag Shield to prevent iframe stealing mouse events */
    .drag-shield {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
    }

    /* Console Drawer */
    .console-container {
      height: 165px;
      min-height: 32px;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .console-container.collapsed {
      height: 32px !important;
    }

    .console-header {
      height: 32px;
      padding: 0 12px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      cursor: pointer;
    }

    .console-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .console-title svg {
      width: 13px;
      height: 13px;
    }

    .badge {
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-family: var(--font-mono);
      background-color: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .badge.has-errors {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .console-logs {
      flex: 1;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 0;
      user-select: text;
    }

    .log-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 12px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.08);
      line-height: 1.45;
      word-break: break-word;
    }

    .log-row:hover {
      background-color: var(--bg-secondary);
    }

    .log-time {
      color: var(--text-muted);
      font-size: 10px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .log-content {
      flex: 1;
      white-space: pre-wrap;
      color: var(--text-primary);
    }

    .log-row.warn { background-color: rgba(245, 158, 11, 0.07); }
    .log-row.warn .log-content { color: var(--warning); }

    .log-row.error { background-color: rgba(239, 68, 68, 0.08); }
    .log-row.error .log-content { color: var(--danger); }

    .log-row.info .log-content { color: var(--info); }

    .console-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-top: 1px solid var(--border);
      background-color: var(--bg-primary);
    }

    .console-input-bar svg {
      width: 13px;
      height: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .console-eval-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    /* Footer Status Bar */
    .statusbar {
      height: 24px;
      background-color: var(--bg-primary);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
      z-index: 20;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 36px;
      right: 16px;
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transform: translateY(12px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 3000;
    }

    .toast.visible {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Hidden File Input for Local Multi-File Import -->
  <input type="file" id="file-upload-input" accept=".html,.htm,.css,.js" multiple style="display: none;" />

  <!-- Drag Shield for Split & Viewport Resizing -->
  <div class="drag-shield" id="drag-shield"></div>

  <!-- Fullscreen Preview Overlay -->
  <div class="fullscreen-overlay" id="fullscreen-overlay">
    <div class="fullscreen-bar">
      <span class="brand-dot"></span>
      <span>Live Fullscreen Preview</span>
      <span id="fs-dimensions" style="opacity: 0.7;"></span>
      <button class="fs-exit-btn" onclick="toggleFullscreenPreview(false)" title="Exit Fullscreen (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3v3a2 2 0 0 1-2 2H3"></path>
          <path d="M21 8h-3a2 2 0 0 1-2-2V3"></path>
          <path d="M3 16h3a2 2 0 0 1 2 2v3"></path>
          <path d="M16 21v-3a2 2 0 0 1 2-2h3"></path>
        </svg>
        <span>Exit Fullscreen</span>
      </button>
    </div>
    <iframe id="fs-preview-frame" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Studio</span>
      </div>
      <div class="divider-v"></div>

      <!-- Language File Tabs -->
      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-html" data-lang="html" onclick="switchTab('html')">
          <span class="lang-indicator lang-html"></span>
          <span>index.html</span>

  <!-- Status Bar -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Monaco Loader from CDN with CORS-safe Blob Worker -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
    const STORAGE_KEY = 'studio_enterprise_compiler_v2';

    // Start completely empty by default as requested
    const EMPTY_CODE = {
      html: '',
      css: '',
      javascript: ''
    };

    let state = {
      activeLang: 'html',
      autoRun: true,
      theme: 'dark',
      isFitMode: true,
      isFullscreen: false,
      code: { ...EMPTY_CODE }
    };

    // Load saved code if available
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.code) {
          state.code = {
            html: parsed.code.html || '',
            css: parsed.code.css || '',
            javascript: parsed.code.javascript || ''
          };
        }
        state.theme = parsed.theme || 'dark';
      }
    } catch (e) {}

    let editor = null;
    let models = {};
    let debounceTimer = null;
    let logCount = 0;
    let errorCount = 0;

    if (state.theme === 'light') {
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
    }

    // Fix Monaco Web Worker Cross-Origin & "Script error." issue via Blob URL Worker
    const MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
    require.config({ paths: { vs: `${MONACO_BASE}/vs` } });

    const workerBlobCode = `
      self.MonacoEnvironment = { baseUrl: '${MONACO_BASE}/' };
      importScripts('${MONACO_BASE}/vs/base/worker/workerMain.js');
    `;
    const workerBlobUrl = URL.createObjectURL(new Blob([workerBlobCode], { type: 'application/javascript' }));

    window.MonacoEnvironment = {
      getWorker: function () {
        return new Worker(workerBlobUrl);
      }
    };

    require(['vs/editor/editor.main'], function () {
      monaco.editor.defineTheme('studio-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#09090b',
          'editor.lineHighlightBackground': '#121215',
          'editorLineNumber.foreground': '#52525b',
          'editorLineNumber.activeForeground': '#e4e4e7',
          'editorIndentGuide.background': '#18181b',
          'editorGutter.background': '#09090b'
        }
      });

      monaco.editor.defineTheme('studio-light', {
        base: 'vs',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#ffffff',
          'editor.lineHighlightBackground': '#f8fafc',
          'editorLineNumber.foreground': '#94a3b8',
          'editorGutter.background': '#ffffff'
        }
      });

      models.html = monaco.editor.createModel(state.code.html, 'html');
      models.css = monaco.editor.createModel(state.code.css, 'css');
      models.javascript = monaco.editor.createModel(state.code.javascript, 'javascript');

      editor = monaco.editor.create(document.getElementById('monaco-root'), {
        model: models.html,
        theme: state.theme === 'dark' ? 'studio-dark' : 'studio-light',
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 13,
        lineHeight: 21,
        fontLigatures: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        smoothScrolling: true,
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
        padding: { top: 14, bottom: 14 },
        renderLineHighlight: 'all',
        bracketPairColorization: { enabled: true },
        automaticLayout: true,
        tabSize: 2
      });

      // Listen for changes or replacements across all models for instant live hot-reload
      Object.keys(models).forEach((lang) => {
        models[lang].onDidChangeContent(() => {
          state.code[lang] = models[lang].getValue();
          updateTabContentIndicators();
          persistState();
          if (state.autoRun) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => compileCode(false), 180);
          }
        });
      });

      editor.onDidChangeCursorPosition((e) => {
        document.getElementById('status-cursor').textContent =
          `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
      });

      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
        compileCode(true);
      });

      updateTabContentIndicators();
      compileCode(false);
      syncDimensionInputsToBox();
    });

    function switchTab(lang) {
      if (!editor || !models[lang]) return;
      state.activeLang = lang;
      editor.setModel(models[lang]);
      editor.focus();

      document.querySelectorAll('.tab').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      const labelMap = { html: 'HTML', css: 'CSS', javascript: 'JavaScript' };
      document.getElementById('status-lang').textContent = labelMap[lang];
    }

    // Track which files have written code
    function getWrittenFiles() {
      const files = [];
      if (state.code.html && state.code.html.trim().length > 0) {
        files.push({ key: 'html', name: 'index.html', mime: 'text/html', content: state.code.html });
      }
      if (state.code.css && state.code.css.trim().length > 0) {
        files.push({ key: 'css', name: 'styles.css', mime: 'text/css', content: state.code.css });
      }
      if (state.code.javascript && state.code.javascript.trim().length > 0) {
        files.push({ key: 'javascript', name: 'app.js', mime: 'text/javascript', content: state.code.javascript });
      }
      return files;
    }

    function updateTabContentIndicators() {
      const hasHtml = state.code.html.trim().length > 0;
      const hasCss = state.code.css.trim().length > 0;
      const hasJs = state.code.javascript.trim().length > 0;

      document.getElementById('tab-html').classList.toggle('has-content', hasHtml);
      document.getElementById('tab-css').classList.toggle('has-content', hasCss);
      document.getElementById('tab-javascript').classList.toggle('has-content', hasJs);

      const count = (hasHtml ? 1 : 0) + (hasCss ? 1 : 0) + (hasJs ? 1 : 0);
      document.getElementById('status-files-count').textContent =
        `${count} active ${count === 1 ? 'file' : 'files'}`;
    }

    // Build and execute live preview document
    function buildPreviewDocument() {
      const html = state.code.html;
      const css = state.code.css;
      const js = state.code.javascript;

      const consoleBridgeScript = `
        <script>
          (function() {
            const send = (level, args) => {
              try {
                const serialized = Array.from(args).map(item => {
                  if (item instanceof Error) return item.stack || item.message;
                  if (typeof item === 'object' && item !== null) {
                    try { return JSON.stringify(item, null, 2); } catch(e) { return String(item); }
                  }
                  return String(item);
                });
                window.parent.postMessage({ source: 'studio-sandbox', level, payload: serialized }, '*');
              } catch (err) {}
            };

            const origLog = console.log;
            const origWarn = console.warn;
            const origError = console.error;
            const origInfo = console.info;

            console.log = function(...args) { send('log', args); origLog.apply(console, args); };
            console.warn = function(...args) { send('warn', args); origWarn.apply(console, args); };
            console.error = function(...args) { send('error', args); origError.apply(console, args); };
            console.info = function(...args) { send('info', args); origInfo.apply(console, args); };

            window.addEventListener('error', function(e) {
              if (e.message === 'Script error.' && !e.lineno) return;
              send('error', [e.message + (e.lineno ? ' (Line ' + e.lineno + ')' : '')]);
            });

            window.addEventListener('unhandledrejection', function(e) {
              send('error', ['Unhandled Promise Rejection: ' + e.reason]);
            });

            window.addEventListener('message', function(e) {
              if (e.data && e.data.type === 'studio-eval') {
                try {
                  const res = (0, eval)(e.data.expr);
                  console.log('←', res);
                } catch (err) {
                  console.error(err);
                }
              }
            });
          })();
        <\/script>
      `;

      return `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>${css}</style>
  ${consoleBridgeScript}
</head>
<body>
  ${html}
  <script>
    try {
      ${js}
    } catch (err) {
      console.error(err);
    }
  <\/script>
</body>
</html>`;
    }

    function compileCode(manual = false) {
      const t0 = performance.now();
      clearConsole();

      const documentSource = buildPreviewDocument();
      const frame = document.getElementById('preview-frame');
      frame.srcdoc = documentSource;

      // Also live-update fullscreen preview if open
      if (state.isFullscreen) {
        const fsFrame = document.getElementById('fs-preview-frame');
        fsFrame.srcdoc = documentSource;
      }

      const dt = Math.max(1, Math.round(performance.now() - t0));
      document.getElementById('status-compile-time').textContent = `Hot reloaded in ${dt}ms`;
      if (manual) showToast('Compiled & Live Reloaded');
    }

    // Listen for sandbox console logs
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.source !== 'studio-sandbox') return;
      appendConsoleRow(event.data.level, event.data.payload.join(' '));
    });

    function appendConsoleRow(level, text) {
      const container = document.getElementById('console-logs');
      const row = document.createElement('div');
      row.className = `log-row ${level}`;

      const now = new Date();
      const timestamp = now.toTimeString().split(' ')[0];

      const timeEl = document.createElement('span');
      timeEl.className = 'log-time';
      timeEl.textContent = timestamp;

      const contentEl = document.createElement('div');
      contentEl.className = 'log-content';
      contentEl.textContent = text;

      row.appendChild(timeEl);
      row.appendChild(contentEl);
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;

      logCount++;
      if (level === 'error') errorCount++;
      updateConsoleBadge();
    }

    function clearConsole(e) {
      if (e) e.stopPropagation();
      document.getElementById('console-logs').innerHTML = '';
      logCount = 0;
      errorCount = 0;
      updateConsoleBadge();
    }

    function updateConsoleBadge() {
      const badge = document.getElementById('console-badge');
      badge.textContent = logCount;
      badge.classList.toggle('has-errors', errorCount > 0);
    }

    document.getElementById('console-eval').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        const expr = e.target.value;
        appendConsoleRow('info', `→ ${expr}`);
        const frame = document.getElementById('preview-frame');
        frame.contentWindow.postMessage({ type: 'studio-eval', expr }, '*');
        e.target.value = '';
      }
    });

    function toggleConsoleCollapse() {
      document.getElementById('console-container').classList.toggle('collapsed');
      setTimeout(syncDimensionInputsToBox, 50);
    }

    function toggleAutoRun() {
      state.autoRun = !state.autoRun;
      document.getElementById('btn-autorun').classList.toggle('active-toggle', state.autoRun);
      const badge = document.getElementById('live-status-badge');
      badge.style.opacity = state.autoRun ? '1' : '0.4';
      showToast(state.autoRun ? 'Hot Reload Enabled' : 'Hot Reload Paused');
    }

    function formatActiveCode() {
      if (!editor) return;
      editor.getAction('editor.action.formatDocument').run();
      showToast('Code Formatted');
    }

    /* ============================================================================
     * LOCAL FILE UPLOAD / IMPORT (.html, .css, .js routed by extension)
     * ============================================================================ */
    function triggerFileUpload() {
      const input = document.getElementById('file-upload-input');
      input.value = '';
      input.click();
    }

    document.getElementById('file-upload-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      const importedTabs = [];

      for (const file of files) {
        const name = file.name.toLowerCase();
        const text = await file.text();

        if (name.endsWith('.html') || name.endsWith('.htm')) {
          state.code.html = text;
          if (models.html) models.html.setValue(text);
          importedTabs.push('html');
        } else if (name.endsWith('.css')) {
          state.code.css = text;
          if (models.css) models.css.setValue(text);
          importedTabs.push('css');
        } else if (name.endsWith('.js')) {
          state.code.javascript = text;
          if (models.javascript) models.javascript.setValue(text);
          importedTabs.push('javascript');
        }
      }

      if (importedTabs.length > 0) {
        switchTab(importedTabs[0]);
        updateTabContentIndicators();
        persistState();
        compileCode(false);
        showToast(`Imported ${importedTabs.length} ${importedTabs.length === 1 ? 'file' : 'files'}`);
      } else {
        showToast('Unsupported file type. Select .html, .css, or .js');
      }
    });

    /* ============================================================================
     * SMART CONDITIONAL EXPORT (Single File -> 2 options, Multi File -> ZIP only)
     * ============================================================================ */
    function handleExportButtonClick(e) {
      e.stopPropagation();
      const menu = document.getElementById('export-menu');
      const isOpen = menu.classList.contains('open');

      if (isOpen) {
        menu.classList.remove('open');
        return;
      }

      const writtenFiles = getWrittenFiles();
      if (writtenFiles.length === 0) {
        showToast('Write some code first before exporting');
        return;
      }

      renderExportMenu(writtenFiles);
      menu.classList.add('open');
    }

    function renderExportMenu(writtenFiles) {
      const menu = document.getElementById('export-menu');
      menu.innerHTML = '';

      if (writtenFiles.length === 1) {
        const single = writtenFiles[0];
        menu.innerHTML = `
          <div class="dropdown-header">Single File Detected</div>
          <button class="dropdown-item" onclick="downloadSingleWrittenFile()">
            <span class="dropdown-item-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              <span>Download Single File</span>
            </span>
            <span class="dropdown-ext">${single.name}</span>
          </button>
          <button class="dropdown-item" onclick="exportProjectZip()">
            <span class="dropdown-item-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8v13H3V8"></path>
                <path d="M1 3h22v5H1z"></path>
                <path d="M10 12h4"></path>
              </svg>
              <span>Export ZIP</span>
            </span>
            <span class="dropdown-ext">.zip</span>
          </button>
        `;
      } else {
        menu.innerHTML = `
          <div class="dropdown-header">${writtenFiles.length} Files Detected</div>
          <button class="dropdown-item" onclick="exportProjectZip()">
            <span class="dropdown-item-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8v13H3V8"></path>
                <path d="M1 3h22v5H1z"></path>
                <path d="M10 12h4"></path>
              </svg>
              <span>Export ZIP</span>
            </span>
            <span class="dropdown-ext">${writtenFiles.length} files</span>
          </button>
        `;
      }
    }

    function downloadSingleWrittenFile() {
      document.getElementById('export-menu').classList.remove('open');
      const writtenFiles = getWrittenFiles();
      if (!writtenFiles.length) return;

      const file = writtenFiles[0];
      const blob = new Blob([file.content], { type: file.mime });
      triggerBlobDownload(blob, file.name);
      showToast(`Downloaded ${file.name}`);
    }

    async function exportProjectZip() {
      document.getElementById('export-menu').classList.remove('open');
      const writtenFiles = getWrittenFiles();
      if (!writtenFiles.length) return;

      if (typeof JSZip === 'undefined') {
        showToast('ZIP library still loading, please try again');
        return;
      }

      const zip = new JSZip();

      writtenFiles.forEach((f) => {
        if (f.key === 'html') {
          // Automatically link styles.css and app.js if they were also written and not already linked
          let htmlContent = f.content;
          const hasCss = writtenFiles.some((w) => w.key === 'css');
          const hasJs = writtenFiles.some((w) => w.key === 'javascript');

          if (hasCss && !htmlContent.includes('styles.css')) {
            if (htmlContent.includes('</head>')) {
              htmlContent = htmlContent.replace('</head>', '  <link rel="stylesheet" href="styles.css">\n</head>');
            } else {
              htmlContent = `<link rel="stylesheet" href="styles.css">\n` + htmlContent;
            }
          }
          if (hasJs && !htmlContent.includes('app.js')) {
            if (htmlContent.includes('</body>')) {
              htmlContent = htmlContent.replace('</body>', '  <script src="app.js"><\/script>\n</body>');
            } else {
              htmlContent = htmlContent + `\n<script src="app.js"><\/script>`;
            }
          }
          zip.file('index.html', htmlContent);
        } else {
          zip.file(f.name, f.content);
        }
      });

      const blob = await zip.generateAsync({ type: 'blob' });
      triggerBlobDownload(blob, 'studio-project.zip');
      showToast('Exported studio-project.zip');
    }

    function triggerBlobDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    window.addEventListener('click', () => {
      const menu = document.getElementById('export-menu');
      if (menu) menu.classList.remove('open');
    });

    /* ============================================================================
     * FULLSCREEN PREVIEW MODE
     * ============================================================================ */
    function toggleFullscreenPreview(enable) {
      const overlay = document.getElementById('fullscreen-overlay');
      const fsFrame = document.getElementById('fs-preview-frame');
      state.isFullscreen = enable;

      if (enable) {
        fsFrame.srcdoc = buildPreviewDocument();
        overlay.classList.add('active');
        document.getElementById('fs-dimensions').textContent =
          `${window.innerWidth} × ${window.innerHeight}px`;

        if (overlay.requestFullscreen) {
          overlay.requestFullscreen().catch(() => {});
        }
      } else {
        overlay.classList.remove('active');
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && state.isFullscreen) {
        document.getElementById('fullscreen-overlay').classList.remove('active');
        state.isFullscreen = false;
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.isFullscreen) {
        toggleFullscreenPreview(false);
      }
    });

    window.addEventListener('resize', () => {
      if (state.isFullscreen) {
        document.getElementById('fs-dimensions').textContent =
          `${window.innerWidth} × ${window.innerHeight}px`;
      }
      if (state.isFitMode) {
        syncDimensionInputsToBox();
      }
    });

    /* ============================================================================
     * DEVTOOLS INSPECT-STYLE RESIZABLE PREVIEW VIEWPORT
     * ============================================================================ */
    const stageEl = document.getElementById('preview-stage');
    const vpBoxEl = document.getElementById('inspect-viewport-box');
    const widthInputEl = document.getElementById('vp-width-input');
    const heightInputEl = document.getElementById('vp-height-input');
    const fitBtnEl = document.getElementById('btn-fit-vp');

    function syncDimensionInputsToBox() {
      const rect = vpBoxEl.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        widthInputEl.value = Math.round(rect.width);
        heightInputEl.value = Math.round(rect.height);
      }
    }

    function setCustomViewportSize(w, h) {
      if (state.isFitMode) {
        state.isFitMode = false;
        stageEl.classList.remove('fit-mode');
        fitBtnEl.classList.remove('active-toggle');
      }
      const clampedW = Math.max(200, Math.round(w));
      const clampedH = Math.max(140, Math.round(h));
      vpBoxEl.style.width = `${clampedW}px`;
      vpBoxEl.style.height = `${clampedH}px`;
      widthInputEl.value = clampedW;
      heightInputEl.value = clampedH;
    }

    function resetViewportToFit() {
      state.isFitMode = true;
      stageEl.classList.add('fit-mode');
      fitBtnEl.classList.add('active-toggle');
      vpBoxEl.style.width = '100%';
      vpBoxEl.style.height = '100%';
      setTimeout(syncDimensionInputsToBox, 20);
    }

    // Switch from Fit mode to interactive Inspect Resizable mode when user clicks stage or inputs
    widthInputEl.addEventListener('change', () => {
      setCustomViewportSize(Number(widthInputEl.value) || 800, Number(heightInputEl.value) || 600);
    });
    heightInputEl.addEventListener('change', () => {
      setCustomViewportSize(Number(widthInputEl.value) || 800, Number(heightInputEl.value) || 600);
    });

    // Enable Inspect Handles anytime user hovers near edges or drags
    (function initInspectViewportResizer() {
      const handleR = document.getElementById('vp-handle-r');
      const handleB = document.getElementById('vp-handle-b');
      const handleBR = document.getElementById('vp-handle-br');
      const shield = document.getElementById('drag-shield');

      let mode = null; // 'r' | 'b' | 'br'
      let startX = 0;
      let startY = 0;
      let startW = 0;
      let startH = 0;

      function startInspectDrag(e, dir) {
        e.preventDefault();
        e.stopPropagation();
        const rect = vpBoxEl.getBoundingClientRect();
        startW = rect.width;
        startH = rect.height;
        startX = e.clientX;
        startY = e.clientY;
        mode = dir;

        if (state.isFitMode) {
          setCustomViewportSize(startW - 32, startH - 32);
          startW = vpBoxEl.getBoundingClientRect().width;
          startH = vpBoxEl.getBoundingClientRect().height;
        }

        shield.style.display = 'block';
        shield.style.cursor = dir === 'r' ? 'ew-resize' : dir === 'b' ? 'ns-resize' : 'nwse-resize';

        if (dir === 'r') handleR.classList.add('active');
        if (dir === 'b') handleB.classList.add('active');
        if (dir === 'br') handleBR.classList.add('active');
      }

      handleR.addEventListener('mousedown', (e) => startInspectDrag(e, 'r'));
      handleB.addEventListener('mousedown', (e) => startInspectDrag(e, 'b'));
      handleBR.addEventListener('mousedown', (e) => startInspectDrag(e, 'br'));

      window.addEventListener('mousemove', (e) => {
        if (!mode) return;
        const dx = (e.clientX - startX) * 2; // *2 because viewport box is centered horizontally
        const dy = e.clientY - startY;

        const nextW = (mode === 'r' || mode === 'br') ? startW + dx : startW;
        const nextH = (mode === 'b' || mode === 'br') ? startH + dy : startH;
        setCustomViewportSize(nextW, nextH);
      });

      window.addEventListener('mouseup', () => {
        if (!mode) return;
        mode = null;
        shield.style.display = 'none';
        handleR.classList.remove('active');
        handleB.classList.remove('active');
        handleBR.classList.remove('active');
      });
    })();

    // Allow toggling between Fit and Inspect Resizable mode by clicking Fit button
    fitBtnEl.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.isFitMode) {
        const rect = stageEl.getBoundingClientRect();
        setCustomViewportSize(Math.max(320, rect.width - 56), Math.max(220, rect.height - 56));
      } else {
        resetViewportToFit();
      }
    });

    /* ============================================================================
     * WORKSPACE UTILITIES (CLEAR, THEME, PERSISTENCE, SPLITTERS)
     * ============================================================================ */
    function clearAllWorkspace() {
      state.code = { ...EMPTY_CODE };
      if (models.html) models.html.setValue('');
      if (models.css) models.css.setValue('');
      if (models.javascript) models.javascript.setValue('');
      updateTabContentIndicators();
      persistState();
      compileCode(false);
      showToast('All editors cleared');
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      document.documentElement.classList.toggle('light', state.theme === 'light');
      if (editor) {
        monaco.editor.setTheme(state.theme === 'dark' ? 'studio-dark' : 'studio-light');
      }
      persistState();
    }

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          code: state.code,
          theme: state.theme
        }));
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('visible'), 2000);
    }

    // Main Split Pane Dragging Mechanics
    (function initSplitResizers() {
      const resizerH = document.getElementById('resizer-h');
      const resizerV = document.getElementById('resizer-v');
      const paneEditor = document.getElementById('pane-editor');
      const consoleBox = document.getElementById('console-container');
      const workspace = document.getElementById('workspace');
      const paneOutput = document.getElementById('pane-output');
      const shield = document.getElementById('drag-shield');

      let draggingH = false;
      let draggingV = false;

      resizerH.addEventListener('mousedown', () => {
        draggingH = true;
        resizerH.classList.add('dragging');
        shield.style.display = 'block';
        shield.style.cursor = 'col-resize';
      });

      resizerV.addEventListener('mousedown', () => {
        draggingV = true;
        resizerV.classList.add('dragging');
        consoleBox.classList.remove('collapsed');
        shield.style.display = 'block';
        shield.style.cursor = 'row-resize';
      });

      window.addEventListener('mousemove', (e) => {
        if (draggingH) {
          const rect = workspace.getBoundingClientRect();
          const newWidth = Math.min(Math.max(240, e.clientX - rect.left), rect.width - 280);
          paneEditor.style.width = `${(newWidth / rect.width) * 100}%`;
          if (state.isFitMode) syncDimensionInputsToBox();
        }
        if (draggingV) {
          const rect = paneOutput.getBoundingClientRect();
          const newHeight = Math.min(Math.max(32, rect.bottom - e.clientY), rect.height - 140);
          consoleBox.style.height = `${newHeight}px`;
          if (state.isFitMode) syncDimensionInputsToBox();
        }
      });

      window.addEventListener('mouseup', () => {
        if (draggingH || draggingV) {
          draggingH = false;
          draggingV = false;
          resizerH.classList.remove('dragging');
          resizerV.classList.remove('dragging');
          shield.style.display = 'none';
        }
      });
    })();
  </script>
</body>
